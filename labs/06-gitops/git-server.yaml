apiVersion: v1
kind: Namespace
metadata:
  name: codelab-git
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: git-server-conf
  namespace: codelab-git
data:
  default.conf: |
    server {
      listen 80;
      location ~ ^/.*\.git(/.*)?$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /usr/libexec/git-core/git-http-backend;
        fastcgi_param GIT_HTTP_EXPORT_ALL "1";
        fastcgi_param GIT_PROJECT_ROOT /srv/git;
        fastcgi_param PATH_INFO $uri;
        fastcgi_pass unix:/run/fcgiwrap.sock;
      }
    }
  start.sh: |
    set -e
    apk add --no-cache git git-daemon fcgiwrap spawn-fcgi >/dev/null
    test -x /usr/libexec/git-core/git-http-backend
    git config --system --add safe.directory '*'
    spawn-fcgi -s /run/fcgiwrap.sock -M 666 -- /usr/bin/fcgiwrap
    cp /conf/default.conf /etc/nginx/conf.d/default.conf
    exec nginx -g 'daemon off;'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-server
  namespace: codelab-git
spec:
  replicas: 1
  selector:
    matchLabels: {app: git-server}
  template:
    metadata:
      labels: {app: git-server}
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        command: ["sh", "/conf/start.sh"]
        ports: [{containerPort: 80}]
        readinessProbe:
          tcpSocket: {port: 80}
          periodSeconds: 3
        volumeMounts:
        - {name: repos, mountPath: /srv/git}
        - {name: conf, mountPath: /conf}
      volumes:
      - name: repos
        emptyDir: {}
      - name: conf
        configMap: {name: git-server-conf}
---
apiVersion: v1
kind: Service
metadata:
  name: git-server
  namespace: codelab-git
spec:
  selector: {app: git-server}
  ports: [{port: 80, targetPort: 80}]

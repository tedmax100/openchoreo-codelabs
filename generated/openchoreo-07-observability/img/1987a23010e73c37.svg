<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 410" width="100%" height="auto" style="max-width:840px; display:block; margin:auto;">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1a73e8" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#137333" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#e37400" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7b1fa2" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#5f6368" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d93025" />
    </marker>
    <filter id="shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#202124" flood-opacity="0.08" />
    </filter>
  </defs>
  <style>
    .f-main { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; }
    .f-code { font-family: "Roboto Mono", Consolas, monospace; }
    .c-title { font-size: 16px; font-weight: 700; fill: #202124; }
    .c-sub { font-size: 12px; fill: #5f6368; }
    .c-head { font-size: 13.5px; font-weight: 700; }
    .c-text { font-size: 12px; fill: #3c4043; }
    .c-code { font-size: 11px; fill: #174ea6; }
    .badge { font-size: 11px; font-weight: 700; text-anchor: middle; }
  </style>
  <!-- Card background -->
  <rect width="840" height="410" rx="10" fill="#ffffff" stroke="#dadce0" stroke-width="1" filter="url(#shadow)"/>

  <!-- Header -->
  <g class="f-main" transform="translate(30, 26)">
    <text class="c-title" x="0" y="0">Observability Plane 收集、儲存與統一查詢管線全景架構</text>
    <text class="c-sub" x="0" y="20">獨立觀測層防止資源爭搶，透過 Observer API 提供統一鑑權門面</text>
  </g>

  <!-- Left: Data Plane (Source) -->
  <g class="f-main" transform="translate(30, 60)">
    <rect width="210" height="330" rx="8" fill="#e6f4ea" fill-opacity="0.4" stroke="#137333" stroke-width="1.5"/>
    <rect x="12" y="10" width="120" height="22" rx="4" fill="#e6f4ea"/>
    <text class="c-head" x="72" y="25" text-anchor="middle" fill="#0d652d" font-size="11">Data Plane (應用)</text>

    <!-- App Pods -->
    <g transform="translate(15, 45)">
      <rect width="180" height="78" rx="6" fill="#ffffff" stroke="#137333"/>
      <text class="c-head" x="10" y="20" font-size="11" fill="#137333">業務服務 Pods</text>
      <text class="c-text" x="10" y="38" font-size="10" fill="#3c4043">• stdout/stderr 日誌輸出</text>
      <text class="c-text" x="10" y="54" font-size="10" fill="#3c4043">• /metrics 指標端點</text>
      <text class="c-text" x="10" y="70" font-size="10" fill="#3c4043">• OTel SDK (Span 追蹤)</text>
    </g>

    <!-- Collectors on Data Plane -->
    <g transform="translate(15, 135)">
      <rect width="180" height="50" rx="4" fill="#ffffff" stroke="#dadce0"/>
      <text class="c-head" x="10" y="20" font-size="11" fill="#202124">Fluent Bit (DaemonSet)</text>
      <text class="c-text" x="10" y="36" font-size="10" fill="#5f6368">每節點掛載日誌檔收集</text>

      <rect y="58" width="180" height="50" rx="4" fill="#ffffff" stroke="#dadce0"/>
      <text class="c-head" x="10" y="78" font-size="11" fill="#202124">Prometheus Scraper</text>
      <text class="c-text" x="10" y="94" font-size="10" fill="#5f6368">定期抓取指標時間序列</text>

      <rect y="116" width="180" height="50" rx="4" fill="#ffffff" stroke="#dadce0"/>
      <text class="c-head" x="10" y="136" font-size="11" fill="#202124">OTel Collector</text>
      <text class="c-text" x="10" y="152" font-size="10" fill="#5f6368">接收 OTLP 追蹤資料</text>
    </g>
  </g>

  <!-- Connectors from Data Plane to Obs Plane -->
  <line x1="240" y1="160" x2="275" y2="160" stroke="#137333" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="240" y1="218" x2="275" y2="218" stroke="#1a73e8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="240" y1="276" x2="275" y2="276" stroke="#e37400" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <!-- Center: Observability Plane (Storage) -->
  <g class="f-main" transform="translate(275, 60)">
    <rect width="250" height="330" rx="8" fill="#f8f9fa" stroke="#5f6368" stroke-width="1.5"/>
    <rect x="12" y="10" width="185" height="22" rx="4" fill="#f1f3f4"/>
    <text class="c-head" x="104" y="25" text-anchor="middle" fill="#3c4043" font-size="11">Observability Plane (儲存中心)</text>

    <!-- Storage Engines -->
    <g transform="translate(15, 45)">
      <!-- OpenSearch -->
      <rect width="220" height="110" rx="6" fill="#ffffff" stroke="#137333"/>
      <text class="c-head" x="10" y="22" font-size="12" fill="#0d652d">🔍 OpenSearch 叢集</text>
      <text class="c-text" x="10" y="42" font-size="11" fill="#3c4043">• 日誌索引 (Logs Index)</text>
      <text class="c-text" x="10" y="58" font-size="11" fill="#3c4043">• 叢集事件 (K8s Events Index)</text>
      <text class="c-text" x="10" y="74" font-size="11" fill="#3c4043">• 跨服務追蹤 (Traces / Spans)</text>
      <rect x="10" y="82" width="200" height="20" rx="3" fill="#e6f4ea"/>
      <text class="c-text" x="110" y="96" text-anchor="middle" font-size="10" fill="#137333">全文檢索與豐富元數據搜尋</text>

      <!-- VictoriaMetrics -->
      <rect y="125" width="220" height="95" rx="6" fill="#ffffff" stroke="#1a73e8"/>
      <text class="c-head" x="10" y="147" font-size="12" fill="#174ea6">📈 VictoriaMetrics / Prometheus</text>
      <text class="c-text" x="10" y="167" font-size="11" fill="#3c4043">• 時間序列資料庫 (TSDB)</text>
      <text class="c-text" x="10" y="183" font-size="11" fill="#3c4043">• 支援 PromQL 語法查詢</text>
      <rect x="10" y="191" width="200" height="20" rx="3" fill="#e8f0fe"/>
      <text class="c-text" x="110" y="205" text-anchor="middle" font-size="10" fill="#174ea6">高性能指標聚合與存儲</text>
    </g>

    <!-- Isolation note -->
    <rect x="15" y="285" width="220" height="30" rx="4" fill="#ffffff" stroke="#5f6368" stroke-dasharray="3,3"/>
    <text class="c-text" x="125" y="304" text-anchor="middle" font-size="10.5" fill="#5f6368">✓ 觀測資料量大，完全與應用隔離</text>
  </g>

  <!-- Connectors from Obs Plane to Consumer Layer -->
  <line x1="525" y1="210" x2="560" y2="210" stroke="#7b1fa2" stroke-width="2.5" marker-end="url(#arrow-purple)"/>

  <!-- Right: Consumption (Observer API & Clients) -->
  <g class="f-main" transform="translate(560, 60)">
    <rect width="250" height="330" rx="8" fill="#f3e8fd" fill-opacity="0.4" stroke="#7b1fa2" stroke-width="1.5"/>
    <rect x="12" y="10" width="165" height="22" rx="4" fill="#f3e8fd"/>
    <text class="c-head" x="94" y="25" text-anchor="middle" fill="#6a1b9a" font-size="11">消費層 (體驗與 API)</text>

    <!-- Unified Observer API -->
    <g transform="translate(15, 45)">
      <rect width="220" height="90" rx="6" fill="#ffffff" stroke="#7b1fa2" stroke-width="1.8"/>
      <text class="c-head" x="10" y="24" font-size="12.5" fill="#6a1b9a">🚪 Observer API (統一閘道)</text>
      <text class="c-text" x="10" y="44" font-size="10.5" fill="#3c4043">• OAuth 2.0 身分驗證保護</text>
      <text class="c-text" x="10" y="60" font-size="10.5" fill="#3c4043">• 封裝底層多種儲存引擎</text>
      <text class="c-text" x="10" y="76" font-size="10.5" fill="#137333" font-weight="600">✓ 抽象化查詢，後端可自由替換</text>
    </g>

    <!-- Down to clients -->
    <line x1="125" y1="140" x2="125" y2="155" stroke="#7b1fa2" stroke-width="2" marker-end="url(#arrow-purple)"/>

    <!-- Consumer tools -->
    <g transform="translate(15, 155)">
      <rect width="220" height="42" rx="4" fill="#ffffff" stroke="#dadce0"/>
      <text class="c-head" x="10" y="20" font-size="11" fill="#202124">Backstage 開發者入口</text>
      <text class="c-text" x="10" y="34" font-size="10" fill="#5f6368">UI 圖形儀表板直接檢視日誌與追蹤</text>

      <rect y="48" width="220" height="42" rx="4" fill="#ffffff" stroke="#dadce0"/>
      <text class="c-head" x="10" y="68" font-size="11" fill="#202124">occ 命令列工具</text>
      <text class="c-code" x="10" y="82" font-size="10">occ component logs</text>

      <rect y="96" width="220" height="42" rx="4" fill="#ffffff" stroke="#7b1fa2"/>
      <text class="c-head" x="10" y="116" font-size="11" fill="#7b1fa2">AI MCP 伺服器 (第 10 課)</text>
      <text class="c-text" x="10" y="130" font-size="10" fill="#5f6368">提供 AI Agent 智能查詢排錯能力</text>
    </g>
  </g>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 395" width="100%" height="auto" style="max-width:840px; display:block; margin:auto;">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1a73e8" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#137333" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#e37400" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7b1fa2" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#5f6368" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d93025" />
    </marker>
    <filter id="shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#202124" flood-opacity="0.08" />
    </filter>
  </defs>
  <style>
    .f-main { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; }
    .f-code { font-family: "Roboto Mono", Consolas, monospace; }
    .c-title { font-size: 16px; font-weight: 700; fill: #202124; }
    .c-sub { font-size: 12px; fill: #5f6368; }
    .c-head { font-size: 13.5px; font-weight: 700; }
    .c-text { font-size: 12px; fill: #3c4043; }
    .c-code { font-size: 11px; fill: #174ea6; }
    .badge { font-size: 11px; font-weight: 700; text-anchor: middle; }
  </style>
  <!-- Card background -->
  <rect width="840" height="395" rx="10" fill="#ffffff" stroke="#dadce0" stroke-width="1" filter="url(#shadow)"/>

  <!-- Header -->
  <g class="f-main" transform="translate(30, 26)">
    <text class="c-title" x="0" y="0">DeploymentPipeline 有向無環圖 (Promotion DAG) 與階段推進</text>
    <text class="c-sub" x="0" y="20">環境推進順序由平台規則強制約束，防止未經驗證的版本越級跳入正式環境</text>
  </g>

  <!-- DAG Flow -->
  <g class="f-main" transform="translate(30, 65)">
    <!-- Stage 1: Development -->
    <g transform="translate(0, 0)">
      <rect width="230" height="230" rx="8" fill="#e6f4ea" stroke="#137333" stroke-width="2"/>
      <rect x="12" y="12" width="120" height="24" rx="4" fill="#ffffff" stroke="#137333"/>
      <text class="c-head" x="72" y="28" text-anchor="middle" fill="#137333">1. development</text>

      <rect x="12" y="48" width="206" height="34" rx="4" fill="#ffffff"/>
      <text class="c-head" x="20" y="68" font-size="11" fill="#137333">autoDeploy: true</text>
      <text class="c-text" x="125" y="68" font-size="10.5" fill="#5f6368">(新版本自動入駐)</text>

      <g transform="translate(12, 92)">
        <text class="c-text" x="0" y="15" font-size="11" fill="#3c4043">• 目的：開發者快速試錯與自測</text>
        <text class="c-text" x="0" y="33" font-size="11" fill="#3c4043">• 容許偶發不穩定與頻繁更新</text>
        <text class="c-text" x="0" y="51" font-size="11" fill="#3c4043">• 資源規格：輕量 (1 副本)</text>
        <text class="c-text" x="0" y="69" font-size="11" fill="#137333" font-weight="600">✓ 任何 commit 即可即時預覽</text>
      </g>

      <rect x="12" y="185" width="206" height="32" rx="4" fill="#ffffff" stroke="#137333"/>
      <text class="c-code" x="115" y="205" text-anchor="middle" font-size="10.5">狀態：Release v2 (最新)</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <g transform="translate(235, 115)">
      <line x1="0" y1="0" x2="35" y2="0" stroke="#137333" stroke-width="2.5" marker-end="url(#arrow-green)"/>
      <text class="c-head" x="18" y="-10" text-anchor="middle" font-size="11" fill="#137333">晉升推進</text>
      <text class="c-code" x="18" y="16" text-anchor="middle" font-size="9" fill="#5f6368">occ promote</text>
    </g>

    <!-- Stage 2: Staging -->
    <g transform="translate(275, 0)">
      <rect width="230" height="230" rx="8" fill="#fef7e0" stroke="#e37400" stroke-width="2"/>
      <rect x="12" y="12" width="100" height="24" rx="4" fill="#ffffff" stroke="#e37400"/>
      <text class="c-head" x="62" y="28" text-anchor="middle" fill="#e37400">2. staging</text>

      <rect x="12" y="48" width="206" height="34" rx="4" fill="#ffffff"/>
      <text class="c-head" x="20" y="68" font-size="11" fill="#b06000">明確手動/審核晉升</text>
      <text class="c-text" x="135" y="68" font-size="10.5" fill="#5f6368">(不自動跳進)</text>

      <g transform="translate(12, 92)">
        <text class="c-text" x="0" y="15" font-size="11" fill="#3c4043">• 目的：上線前完整預演與整合</text>
        <text class="c-text" x="0" y="33" font-size="11" fill="#3c4043">• 模擬高擬真流量與周邊依賴</text>
        <text class="c-text" x="0" y="51" font-size="11" fill="#3c4043">• 資源規格：中等 (2 副本)</text>
        <text class="c-text" x="0" y="69" font-size="11" fill="#b06000" font-weight="600">✓ QA / 整合驗證無誤</text>
      </g>

      <rect x="12" y="185" width="206" height="32" rx="4" fill="#ffffff" stroke="#e37400"/>
      <text class="c-code" x="115" y="205" text-anchor="middle" font-size="10.5">狀態：Release v1 (穩定版)</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <g transform="translate(510, 115)">
      <line x1="0" y1="0" x2="35" y2="0" stroke="#e37400" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
      <text class="c-head" x="18" y="-10" text-anchor="middle" font-size="11" fill="#b06000">發布門禁</text>
      <text class="c-code" x="18" y="16" text-anchor="middle" font-size="9" fill="#5f6368">人工簽核</text>
    </g>

    <!-- Stage 3: Production -->
    <g transform="translate(550, 0)">
      <rect width="230" height="230" rx="8" fill="#f3e8fd" stroke="#7b1fa2" stroke-width="2"/>
      <rect x="12" y="12" width="115" height="24" rx="4" fill="#ffffff" stroke="#7b1fa2"/>
      <text class="c-head" x="70" y="28" text-anchor="middle" fill="#7b1fa2">3. production</text>

      <rect x="12" y="48" width="206" height="34" rx="4" fill="#ffffff"/>
      <text class="c-head" x="20" y="68" font-size="11" fill="#6a1b9a">isProduction: true</text>
      <text class="c-text" x="135" y="68" font-size="10.5" fill="#5f6368">(最高等級防護)</text>

      <g transform="translate(12, 92)">
        <text class="c-text" x="0" y="15" font-size="11" fill="#3c4043">• 目的：真正服務外部終端用戶</text>
        <text class="c-text" x="0" y="33" font-size="11" fill="#3c4043">• 啟用 PDB (防自願性中斷斷線)</text>
        <text class="c-text" x="0" y="51" font-size="11" fill="#3c4043">• 資源規格：高可用 (3+ 副本)</text>
        <text class="c-text" x="0" y="69" font-size="11" fill="#6a1b9a" font-weight="600">✓ 嚴禁未經 staging 直推</text>
      </g>

      <rect x="12" y="185" width="206" height="32" rx="4" fill="#ffffff" stroke="#7b1fa2"/>
      <text class="c-code" x="115" y="205" text-anchor="middle" font-size="10.5">狀態：Release v1 (現役版)</text>
    </g>
  </g>

  <!-- DAG Constraint Policy Bar -->
  <g class="f-main" transform="translate(30, 310)">
    <rect width="780" height="60" rx="6" fill="#f8f9fa" stroke="#dadce0"/>
    <text class="c-head" x="15" y="24" fill="#202124" font-size="12">🛡️ DeploymentPipeline 強制規範有向路徑 (Promotion Paths)：</text>
    <text class="c-text" x="15" y="44" fill="#3c4043" font-size="11.5">
      規定 <tspan class="f-code" fill="#7b1fa2">production</tspan> 的前置來源只能是 <tspan class="f-code" fill="#e37400">staging</tspan>。即使開發者在 dev 發現迫切修正，也必須順著有向圖依序通過驗證，杜絕衝動直推導致的線上事故！
    </text>
  </g>

</svg>

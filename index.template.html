<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenChoreo 實戰 Codelabs</title>
<style>:root{--bg:#f8f9fa;--fg:#202124;--card:#fff;--bd:#dadce0;--ac:#1a73e8}@media(prefers-color-scheme:dark){:root{--bg:#202124;--fg:#e8eaed;--card:#2d2e31;--bd:#3c4043;--ac:#8ab4f8}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans TC",sans-serif}main{max-width:880px;margin:0 auto;padding:48px 16px}
h1{margin:0 0 8px}.sub{opacity:.75;margin-bottom:32px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{display:block;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:20px;text-decoration:none;color:inherit}.card:hover{border-color:var(--ac)}
.n{color:var(--ac);font-weight:700}.card h2{font-size:18px;margin:6px 0}.card p{margin:0 0 12px;opacity:.8;font-size:14px}small{opacity:.6}</style></head>
<body><main><h1>OpenChoreo 實戰 Codelabs</h1><div class="sub">由淺入深,在本機 Kubernetes 上學會 OpenChoreo 內部開發者平台(v1.3.1)</div><div class="grid">@@CARDS@@</div></main></body></html>
